<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>suigui SDK Preview</title>
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <header>
      <h1>suigui</h1>
      <p>SoftUI GUI language — edit `.sui`, run on canvas. No Zig/WASM required.</p>
    </header>
    <main>
      <section class="pane">
        <div class="toolbar">
          <label for="example">Example</label>
          <select id="example">
            <option value="hello.sui">hello.sui</option>
            <option value="counter.sui">counter.sui</option>
            <option value="calculator.sui" selected>calculator.sui</option>
          </select>
          <button type="button" id="reload" class="primary">Run</button>
        </div>
        <textarea id="source" spellcheck="false" aria-label="suigui source"></textarea>
        <div id="status" class="status">Ready.</div>
      </section>
      <section class="pane">
        <div class="toolbar">
          <span style="color: var(--dim); font-size: 12px">Live canvas preview</span>
        </div>
        <div class="canvas-wrap">
          <canvas id="view" width="360" height="480"></canvas>
        </div>
      </section>
    </main>
    <script type="module" src="./main.js"></script>
  </body>
</html>
